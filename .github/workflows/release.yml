name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            runner.sh \
            runner.ps1 \
            install.sh \
            install.ps1 \
            make-claude-md.sh \
            make-claude-md.ps1 \
            --title "${{ github.ref_name }}" \
            --generate-notes
