name: Unblock Sweep

# Runs whenever an issue closes or a PR merges.
# Finds all issues labelled `blocked`, checks their ## Blocked By section,
# and removes the `blocked` label when every listed dependency is closed.

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

jobs:
  unblock:
    name: Unblock sweep
    if: github.event_name == 'issues' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Unblock sweep
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch all open issues with the 'blocked' label (up to 100).
            const blocked = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo:  context.repo.repo,
                labels: 'blocked',
                state:  'open',
                per_page: 100,
              }
            );

            if (blocked.length === 0) {
              console.log('No blocked issues found.');
              return;
            }

            for (const issue of blocked) {
              const body = issue.body || '';

              // Parse ## Blocked By section: extract all #N references.
              const section = body.match(/##\s*Blocked By[\s\S]*?(?=\n##|\s*$)/i)?.[0] || '';
              const depNums = [...section.matchAll(/#(\d+)/g)].map(m => parseInt(m[1]));

              if (depNums.length === 0) {
                console.log(`Issue #${issue.number}: blocked label but no deps listed — skipping.`);
                continue;
              }

              // Check each dependency.
              let allClosed = true;
              for (const num of depNums) {
                const { data: dep } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: num,
                });
                if (dep.state !== 'closed') {
                  allClosed = false;
                  console.log(`Issue #${issue.number}: dep #${num} still open.`);
                  break;
                }
              }

              if (!allClosed) continue;

              // All deps closed — remove blocked label.
              console.log(`Issue #${issue.number}: all deps closed. Removing 'blocked' label.`);
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                name: 'blocked',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `agent: unblocked — all dependencies (${depNums.map(n => `#${n}`).join(', ')}) are now closed.`,
              });
            }
