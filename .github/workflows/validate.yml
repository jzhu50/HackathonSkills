name: Validate

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -- bash bootstrap (Linux + macOS) -------------------------------------------
  validate-bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          bash -n make-claude-md.sh
          bash -n install.sh
          bash -n runner.sh
          echo "Shell syntax OK"

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: ShellCheck
        run: shellcheck make-claude-md.sh install.sh runner.sh

      - name: Check template files exist
        run: |
          failed=0
          for f in PLAN.md SPECS.md AGENTS.md hackathon.config.yml; do
            [[ -f "$f" ]] || { echo "MISSING: $f"; failed=1; }
          done
          [[ $failed -eq 0 ]] && echo "Template files OK"
          exit $failed

      - name: Check hackathon.config.yml structure
        run: |
          failed=0
          for key in project_breakdown epic_breakdown task_breakdown task_completion code_review epic_review; do
            grep -q "${key}:" hackathon.config.yml\
              || { echo "MISSING key: $key in hackathon.config.yml"; failed=1; }
          done
          [[ $failed -eq 0 ]] && echo "hackathon.config.yml structure OK"
          exit $failed

      - name: Check issue template frontmatter
        run: |
          failed=0
          for f in .github/ISSUE_TEMPLATE/*.md; do
            grep -q '^name:'  "$f" || { echo "MISSING name: in $f";  failed=1; }
            grep -q '^about:' "$f" || { echo "MISSING about: in $f"; failed=1; }
          done
          [[ $failed -eq 0 ]] && echo "Issue template frontmatter OK"
          exit $failed

      - name: Check skill frontmatter
        run: |
          failed=0
          for f in skills/*.md; do
            grep -q '^description:'   "$f" || { echo "MISSING description: in $f";   failed=1; }
            grep -q '^allowed-tools:' "$f" || { echo "MISSING allowed-tools: in $f"; failed=1; }
          done
          [[ $failed -eq 0 ]] && echo "Skill frontmatter OK ($(find skills -maxdepth 1 -name '*.md' | wc -l | tr -d ' ') skills)"
          exit $failed

      - name: Run bootstrap and verify outputs
        run: |
          tmp=$(mktemp -d)
          bash make-claude-md.sh "$tmp"

          [[ -s "$tmp/CLAUDE.md" ]] || { echo "FAIL: CLAUDE.md missing or empty"; exit 1; }

          skill_count=$(find skills -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          cmd_count=$(find "$tmp/.claude/commands/" -maxdepth 1 -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$skill_count" -ne "$cmd_count" ]]; then
            echo "FAIL: $skill_count skills but $cmd_count commands in .claude/commands/"
            exit 1
          fi

          [[ -f "$tmp/.claude/settings.json" ]]\
            || { echo "FAIL: .claude/settings.json not generated"; exit 1; }
          python3 -c "import json; json.load(open('$tmp/.claude/settings.json'))"\
            || { echo "FAIL: .claude/settings.json is not valid JSON"; exit 1; }

          for f in skills/*.md; do
            name=$(basename "$f" .md)
            grep -q "# Skill: $name" "$tmp/CLAUDE.md"\
              || { echo "FAIL: CLAUDE.md missing section for $name"; exit 1; }
          done

          echo "Bootstrap OK - $skill_count skills, CLAUDE.md $(wc -c < "$tmp/CLAUDE.md" | tr -d ' ') bytes"

      - name: runner.sh --help exits 0
        run: |
          bash runner.sh --help
          echo "runner.sh --help OK"

      - name: runner.sh PTY spawn with mock CLI
        run: |
          # Spawns the full Python PTY path with 'true' as the CLI.
          # 'true' exits immediately; the PTY master gets EIO and the runner exits 0.
          bash runner.sh --cli true
          echo "runner.sh PTY spawn OK"

  # -- workflow linting (actionlint) --------------------------------------------
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # -- workflow-templates linting -----------------------------------------------
  lint-workflow-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint workflow templates
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color workflow-templates/*.yml

  # -- PowerShell bootstrap (Windows) -------------------------------------------
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check template files exist
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in @("PLAN.md", "SPECS.md", "AGENTS.md", "hackathon.config.yml")) {
            if (-not (Test-Path $f)) { Write-Host "MISSING: $f"; $failed = 1 }
          }
          if ($failed -eq 0) { Write-Host "Template files OK" }
          exit $failed

      - name: Check hackathon.config.yml structure
        shell: pwsh
        run: |
          $content = Get-Content hackathon.config.yml -Raw
          $failed = 0
          foreach ($key in @("project_breakdown", "epic_breakdown", "task_breakdown",
                             "task_completion", "code_review", "epic_review")) {
            if ($content -notmatch "${key}:") { Write-Host "MISSING key: $key"; $failed = 1 }
          }
          if ($failed -eq 0) { Write-Host "hackathon.config.yml structure OK" }
          exit $failed

      - name: Check issue template frontmatter
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in (Get-ChildItem .github\ISSUE_TEMPLATE\*.md)) {
            $content = Get-Content $f.FullName -Raw
            if ($content -notmatch '(?m)^name:')  { Write-Host "MISSING name: in $($f.Name)";  $failed = 1 }
            if ($content -notmatch '(?m)^about:') { Write-Host "MISSING about: in $($f.Name)"; $failed = 1 }
          }
          if ($failed -eq 0) { Write-Host "Issue template frontmatter OK" }
          exit $failed

      - name: Check skill frontmatter
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in (Get-ChildItem skills\*.md)) {
            $content = Get-Content $f.FullName -Raw
            if ($content -notmatch '(?m)^description:')   { Write-Host "MISSING description: in $($f.Name)";   $failed = 1 }
            if ($content -notmatch '(?m)^allowed-tools:') { Write-Host "MISSING allowed-tools: in $($f.Name)"; $failed = 1 }
          }
          $count = (Get-ChildItem skills\*.md).Count
          if ($failed -eq 0) { Write-Host "Skill frontmatter OK ($count skills)" }
          exit $failed

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $failed = 0
          foreach ($script in @("make-claude-md.ps1", "install.ps1", "runner.ps1")) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$null, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "FAIL: $script has $($errors.Count) syntax error(s):"
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = 1
            } else {
              Write-Host "OK: $script"
            }
          }
          exit $failed

      - name: Run bootstrap and verify outputs
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP "hs-validate-$([System.IO.Path]::GetRandomFileName())"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          & .\make-claude-md.ps1 $tmp

          $claudeMd = Join-Path $tmp "CLAUDE.md"
          if (-not (Test-Path $claudeMd) -or (Get-Item $claudeMd).Length -eq 0) {
            Write-Host "FAIL: CLAUDE.md missing or empty"; exit 1
          }

          $skillCount = (Get-ChildItem skills\*.md).Count
          $cmdCount   = (Get-ChildItem (Join-Path $tmp ".claude\commands\*.md") -ErrorAction SilentlyContinue).Count
          if ($skillCount -ne $cmdCount) {
            Write-Host "FAIL: $skillCount skills but $cmdCount commands"; exit 1
          }

          $settingsPath = Join-Path $tmp ".claude\settings.json"
          if (-not (Test-Path $settingsPath)) { Write-Host "FAIL: settings.json not generated"; exit 1 }
          try { $null = Get-Content $settingsPath -Raw | ConvertFrom-Json }
          catch { Write-Host "FAIL: settings.json not valid JSON: $_"; exit 1 }

          $claudeContent = Get-Content $claudeMd -Raw
          $missing = 0
          foreach ($skill in Get-ChildItem skills\*.md) {
            if ($claudeContent -notmatch "# Skill: $($skill.BaseName)") {
              Write-Host "FAIL: CLAUDE.md missing section for $($skill.BaseName)"
              $missing = 1
            }
          }
          if ($missing) { exit 1 }

          Write-Host "Bootstrap OK - $skillCount skills, CLAUDE.md $((Get-Item $claudeMd).Length) bytes"

      - name: runner.ps1 -Help exits 0
        shell: pwsh
        run: |
          & .\runner.ps1 -Help
          Write-Host "runner.ps1 -Help OK"

      - name: runner.ps1 spawn with mock CLI
        shell: pwsh
        run: |
          # Spawns cmd.exe as a mock AI CLI - exits immediately with code 0.
          # Exercises the ConPTY console-resize + process-management path.
          & .\runner.ps1 -Cli cmd -CliArgs @("/c", "exit", "0")
          Write-Host "runner.ps1 spawn OK"
