name: Validate

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── bash bootstrap (Linux + macOS) ───────────────────────────────────────────
  validate-bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          bash -n make-claude-md.sh
          bash -n install.sh
          bash -n runner.sh
          echo "Shell syntax OK"

      - name: Check skill frontmatter
        run: |
          failed=0
          for f in skills/*.md; do
            if ! grep -q '^description:' "$f"; then
              echo "MISSING description: in $f"
              failed=1
            fi
            if ! grep -q '^allowed-tools:' "$f"; then
              echo "MISSING allowed-tools: in $f"
              failed=1
            fi
          done
          [[ $failed -eq 0 ]] && echo "Skill frontmatter OK ($(ls skills/*.md | wc -l | tr -d ' ') skills)"
          exit $failed

      - name: Run bootstrap and verify outputs
        run: |
          tmp=$(mktemp -d)
          bash make-claude-md.sh "$tmp"

          # CLAUDE.md must exist and be non-empty
          [[ -s "$tmp/CLAUDE.md" ]] || { echo "FAIL: CLAUDE.md missing or empty"; exit 1; }

          # command count must match skill count
          skill_count=$(ls skills/*.md | wc -l | tr -d ' ')
          cmd_count=$(ls "$tmp/.claude/commands/"*.md 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$skill_count" -ne "$cmd_count" ]]; then
            echo "FAIL: $skill_count skills but $cmd_count commands in .claude/commands/"
            exit 1
          fi

          # settings.json must exist and be valid JSON
          [[ -f "$tmp/.claude/settings.json" ]] \
            || { echo "FAIL: .claude/settings.json not generated"; exit 1; }
          python3 -c "import json,sys; json.load(open('$tmp/.claude/settings.json'))" \
            || { echo "FAIL: .claude/settings.json is not valid JSON"; exit 1; }

          # CLAUDE.md must contain a section for every skill
          for f in skills/*.md; do
            name=$(basename "$f" .md)
            if ! grep -q "# Skill: $name" "$tmp/CLAUDE.md"; then
              echo "FAIL: CLAUDE.md missing section for $name"
              exit 1
            fi
          done

          echo "Bootstrap OK — $skill_count skills, CLAUDE.md $(wc -c < "$tmp/CLAUDE.md" | tr -d ' ') bytes"

  # ── PowerShell bootstrap (Windows) ───────────────────────────────────────────
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $failed = 0
          foreach ($script in @("make-claude-md.ps1", "install.ps1", "runner.ps1")) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$null, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "FAIL: $script has $($errors.Count) syntax error(s):"
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = 1
            } else {
              Write-Host "OK: $script"
            }
          }
          exit $failed

      - name: Run bootstrap and verify outputs
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP "hs-validate-$([System.IO.Path]::GetRandomFileName())"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          & .\make-claude-md.ps1 $tmp
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: make-claude-md.ps1 exited $LASTEXITCODE"; exit 1 }

          # CLAUDE.md must exist and be non-empty
          $claudeMd = Join-Path $tmp "CLAUDE.md"
          if (-not (Test-Path $claudeMd) -or (Get-Item $claudeMd).Length -eq 0) {
            Write-Host "FAIL: CLAUDE.md missing or empty"; exit 1
          }

          # command count must match skill count
          $skillCount  = (Get-ChildItem skills\*.md).Count
          $cmdCount    = (Get-ChildItem (Join-Path $tmp ".claude\commands\*.md") -ErrorAction SilentlyContinue).Count
          if ($skillCount -ne $cmdCount) {
            Write-Host "FAIL: $skillCount skills but $cmdCount commands in .claude\commands\"; exit 1
          }

          # settings.json must exist and be valid JSON
          $settingsPath = Join-Path $tmp ".claude\settings.json"
          if (-not (Test-Path $settingsPath)) {
            Write-Host "FAIL: .claude\settings.json not generated"; exit 1
          }
          try {
            $null = Get-Content $settingsPath -Raw | ConvertFrom-Json
          } catch {
            Write-Host "FAIL: .claude\settings.json is not valid JSON: $_"; exit 1
          }

          # CLAUDE.md must contain a section for every skill
          $claudeContent = Get-Content $claudeMd -Raw
          $missing = 0
          foreach ($skill in Get-ChildItem skills\*.md) {
            $name = $skill.BaseName
            if ($claudeContent -notmatch "# Skill: $name") {
              Write-Host "FAIL: CLAUDE.md missing section for $name"
              $missing = 1
            }
          }
          if ($missing) { exit 1 }

          $bytes = (Get-Item $claudeMd).Length
          Write-Host "Bootstrap OK — $skillCount skills, CLAUDE.md $bytes bytes"
