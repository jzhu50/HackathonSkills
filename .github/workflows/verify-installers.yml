name: Verify Installers

on:
  push:
    branches: ['refactor/installers']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cli: [claude, aider, codex, antigravity]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare assets for local server
        shell: bash
        run: |
          mkdir dist
          cp runner.sh dist/
          cp make-claude-md.sh dist/
          cp runner.ps1 dist/
          cp make-claude-md.ps1 dist/
          
          # Generate checksums (explicitly list files to avoid including the checksum file itself)
          cd dist
          files="runner.sh make-claude-md.sh runner.ps1 make-claude-md.ps1"
          if command -v sha256sum &> /dev/null; then
            sha256sum $files > checksums.sha256
          elif command -v shasum &> /dev/null; then
            shasum -a 256 $files > checksums.sha256
          fi
          echo "Generated checksums:"
          cat checksums.sha256

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8000 --directory dist &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Give it a moment to start
          for i in {1..10}; do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "Server is up"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done

      - name: Run Installer (Unix)
        if: runner.os != 'Windows'
        run: |
          bash install.sh --base-url http://localhost:8000
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Run Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -BaseUrl http://localhost:8000
          echo "$env:LOCALAPPDATA\hackathon-skills\bin" >> $GITHUB_PATH

      - name: Verify installed files (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -l "$HOME/.local/bin/hackathon-skills"
          ls -l "$HOME/.local/bin/hackathon-bootstrap"

      - name: Verify installed files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ls "$env:LOCALAPPDATA\hackathon-skills\bin\hackathon-skills.ps1"
          ls "$env:LOCALAPPDATA\hackathon-skills\bin\hackathon-skills.cmd"
          ls "$env:LOCALAPPDATA\hackathon-skills\bin\hackathon-bootstrap.ps1"
          ls "$env:LOCALAPPDATA\hackathon-skills\bin\hackathon-bootstrap.cmd"

      - name: Mock AI CLI (${{ matrix.cli }})
        shell: bash
        run: |
          mkdir -p mock_bin
          cat > mock_bin/${{ matrix.cli }} <<EOF
#!/usr/bin/env bash
echo "Mock ${{ matrix.cli }} called with args: \$@"
EOF
          chmod +x mock_bin/${{ matrix.cli }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cat > mock_bin/${{ matrix.cli }}.cmd <<EOF
@echo off
echo Mock ${{ matrix.cli }} called with args: %*
EOF
          fi
          echo "$(pwd)/mock_bin" >> $GITHUB_PATH

      - name: Test runner with ${{ matrix.cli }}
        run: |
          # The installer and mock_bin should be in PATH via $GITHUB_PATH
          hackathon-skills --cli ${{ matrix.cli }} -- test-arg

      - name: Cleanup server
        if: always()
        shell: bash
        run: |
          if [[ -n "$SERVER_PID" ]]; then
            kill $SERVER_PID
          fi
