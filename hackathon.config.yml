# hackathon.config.yml
# Controls human oversight and quality requirements across all hackathon skills.
# Missing file or missing keys default to maximum oversight:
#   all gates: true, testing: required, parallelism: false

gates:
  project_breakdown:
    human_required: true   # approve proposed projects before GitHub Projects are created
    grilling: true         # interrogate before scoping projects

  epic_breakdown:
    human_required: true   # approve proposed epics before writing to GitHub
    grilling: true         # interrogate before scoping epics

  task_breakdown:
    human_required: true   # approve proposed tasks before writing to GitHub
    grilling: true         # interrogate before decomposing each epic

  task_completion:
    human_required: true   # approve completed work before PR opens

  code_review:
    human_required: true   # human triggers review and decides merge/changes on task PRs

  epic_review:
    human_required: true   # human reviews and merges epic->main PR

quality:
  testing: required        # required | recommended | skip
  validation: autonomous-script # agent-generated success scripts block PR

autonomy: total           # enables autonomous loop recovery and metadata tagging

# When true: hackathon-setup structures epics into parallel waves.
parallelism: true

actions:
  gitleaks: false         # secret scanning on every PR
  codeql: false           # security analysis
  dependency_review: false # flag vulnerable packages in PRs
  actionlint: true        # lint .github/workflows/
  markdownlint: true      # lint PLAN.md, SPECS.md, AGENTS.md
  contract: true          # branch/label/issue/env/protected-file contract checks
