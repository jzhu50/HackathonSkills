# hackathon.config.yml
# Controls human oversight and quality requirements across all hackathon skills.
# Missing file or missing keys default to maximum oversight:
#   all gates: true, testing: required, comments: verbose, parallelism: false

gates:
  project_breakdown:
    human_required: true   # present proposed projects in chat and wait for approval before creating GitHub Projects
    grilling: true         # call hackathon-grilling to reach zero ambiguities before scoping projects

  epic_breakdown:
    human_required: true   # present proposed epics in chat and wait for approval before writing to GitHub
    grilling: true         # call hackathon-grilling to reach zero ambiguities before scoping epics

  task_breakdown:
    human_required: true   # present proposed tasks in chat and wait for approval before writing to GitHub
    grilling: true         # call hackathon-grilling to reach zero ambiguities before decomposing each epic

  task_completion:
    human_required: true   # present completed work in chat and wait for approval before opening PR

  code_review:
    human_required: true   # human triggers hackathon-review and decides merge/changes on task PRs

  epic_review:
    human_required: true   # human reviews and merges epic->main PR

quality:
  # required:     full path coverage enforced - hard stop before PR if any code path is uncovered
  # recommended:  main logic paths must be tested - missing edge coverage flagged but not blocking
  # skip:         no test suite run, no test writing requirement
  testing: required

  # verbose:  full GitHub comment trail (claiming, baseline, progress, close-out)
  # minimal:  claiming comment + close-out comment only
  comments: verbose

# When true: hackathon-setup structures epics into parallel waves.
#   Wave 1 - independent foundations, each built with stubs for cross-dependencies
#   Wave 2 - integration epics that wire the foundations together
#   Wave 3 - end-to-end verify
# When false: epics in priority/dependency chain order (original behavior)
parallelism: false

actions:
  gitleaks: true          # secret scanning on every PR
  codeql: true            # security analysis
  dependency_review: true # flag vulnerable packages in PRs
  actionlint: true        # lint .github/workflows/
  markdownlint: true      # lint PLAN.md, SPECS.md, AGENTS.md
  contract: true          # branch/label/issue/env/protected-file contract checks
